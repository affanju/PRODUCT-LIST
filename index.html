<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root{
    --ink:#1c1c1c; --paper:#faf7f2; --line:#e3ddd2;
    --aldi:#f4e7b8; --coles:#f6d9d6; --accent:#8a3b2f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--paper); color:var(--ink);
  }
  header{
    padding:20px 24px 14px; border-bottom:2px solid var(--ink);
    background:#fff;
  }
  header h1{margin:0 0 4px; font-size:1.3rem;}
  header p{margin:0; color:#666; font-size:.85rem;}
  .controls{
    padding:14px 24px; background:#fff; border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:15;
  }
  input{
    font-size:1rem; padding:11px 14px; border:1px solid #c9c2b3; border-radius:10px;
    background:#fff; color:var(--ink); width:100%;
  }
  .search-wrap{position:relative;}
  .sync-bar{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .sync-btn{
    flex:1; min-width:100px; padding:8px 10px; font-size:.78rem; font-weight:600;
    background:#f6f2e9; border:1px solid #ecdcae; border-radius:8px; color:#6b5a2e;
    cursor:pointer; font-family:inherit;
  }
  .sync-btn:active{background:#efe6d2;}
  .sync-status{
    margin-top:8px; font-size:.75rem; color:#3d6b3d; min-height:1em;
  }
  .sync-status.error{color:#a33;}
  .suggestions{
    position:absolute; top:calc(100% + 4px); left:0; right:0; background:#fff;
    border:1px solid #c9c2b3; border-radius:8px; max-height:260px; overflow-y:auto;
    box-shadow:0 6px 18px rgba(0,0,0,.1); z-index:20; display:none;
  }
  .suggestions.open{display:block;}
  .suggestions button{
    display:block; width:100%; text-align:left; background:none; border:none;
    padding:10px 14px; font-size:.9rem; cursor:pointer; border-bottom:1px solid var(--line);
    color:var(--ink);
  }
  .suggestions button:last-child{border-bottom:none;}
  .suggestions button:hover, .suggestions button:focus{background:#f5f1e8;}
  .suggestions .tag{font-size:.7rem; font-weight:700; margin-right:6px; color:#8a8478;}
  .badge{
    display:inline-block; padding:2px 9px; border-radius:20px; font-size:.72rem;
    font-weight:600; letter-spacing:.03em;
  }
  .badge.aldi{background:var(--aldi); color:#6b5000;}
  .badge.coles{background:var(--coles); color:var(--accent);}
  .badge.ww{background:#d6e8d6; color:#2e5c2e;}
  .badge.proprietary{background:#d9e3f0; color:#2e4a6b;}
  main{padding:16px 20px 60px; max-width:820px; margin:0 auto;}
  .empty{color:#888; text-align:center; padding:60px 20px; font-size:.95rem;}

  /* Grouped browse list */
  .group{margin-bottom:14px; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#fff;}
  .group-head{
    display:flex; align-items:center; gap:10px; padding:14px 16px; cursor:pointer;
    user-select:none; background:#fff;
  }
  .group-head .chevron{
    transition:transform .15s ease; font-size:.75rem; color:#b3ab9c;
  }
  .group.collapsed .chevron{transform:rotate(-90deg);}
  .group-head .badge{font-size:.78rem; padding:3px 11px;}
  .group-head .count{color:#a39c8d; font-size:.8rem; margin-left:auto; font-weight:500;}
  .group-note{
    margin:0 12px 10px; padding:8px 10px; background:#fdf6e3; border:1px solid #ecdcae;
    border-radius:8px; font-size:.73rem; color:#6b5a2e;
  }
  .group-list{display:flex; flex-direction:column; border-top:1px solid var(--line);}
  .group.collapsed .group-list{display:none;}
  .subcat-head{
    padding:9px 16px 5px; font-size:.68rem; font-weight:700; text-transform:uppercase;
    letter-spacing:.06em; color:#a39c8d; background:#fbf9f5;
  }
  .product-row{
    display:flex; align-items:center; gap:12px;
    background:#fff; border:none; border-bottom:1px solid #f0ece3;
    padding:12px 16px; cursor:pointer; text-align:left; width:100%;
    font-family:inherit; color:var(--ink);
  }
  .group-list .product-row:last-child{border-bottom:none;}
  .product-row:active{background:#f5f1e8;}
  .product-row .icon{
    font-size:1.3rem; flex-shrink:0; width:34px; height:34px; display:flex;
    align-items:center; justify-content:center; background:#f6f2e9; border-radius:9px;
  }
  .product-row .info{flex:1; min-width:0;}
  .product-row .info .name{font-size:.9rem; font-weight:500; line-height:1.3;}
  .product-row .info .sub{font-size:.75rem; color:#a39c8d; margin-top:1px;}
  .product-row .arrow{color:#c9c2b3; font-size:1.1rem; flex-shrink:0;}

  .back-btn{
    display:inline-flex; align-items:center; gap:6px; background:none; border:none;
    color:var(--accent); font-size:.9rem; font-weight:600; padding:6px 2px 14px;
    cursor:pointer; font-family:inherit;
  }

  .card{
    background:#fff; border:1px solid var(--line); border-radius:14px;
    overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .card-head{
    padding:18px 20px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
  }
  .card-head h2{margin:0 0 6px; font-size:1.15rem; line-height:1.3;}
  .hw-pill{
    flex-shrink:0; background:#fdf6e3; border:1px solid #ecdcae; border-radius:10px;
    padding:6px 12px; text-align:center;
  }
  .hw-pill .hw-label{display:block; font-size:.62rem; text-transform:uppercase; letter-spacing:.05em; color:#a3822e;}
  .hw-pill .hw-value{display:block; font-size:1rem; font-weight:700; color:#6b5a2e; letter-spacing:.02em;}
  .allergen-flag{
    background:#fdecea; color:#a33; border:1px solid #f2c6c2; border-radius:8px;
    padding:10px 14px; margin:14px 20px 0; font-size:.85rem; font-weight:600;
  }
  .grid{
    display:grid; grid-template-columns:1fr 1fr; gap:0;
  }
  .field{
    padding:12px 20px; border-bottom:1px solid var(--line); border-right:1px solid var(--line);
  }
  .field:nth-child(2n){border-right:none;}
  .field .label{
    font-size:.68rem; text-transform:uppercase; letter-spacing:.05em; color:#8a8478; margin-bottom:3px;
  }
  .field .value{font-size:.95rem; font-weight:500; word-break:break-word;}
  .edit-btn{
    display:block; width:calc(100% - 40px); margin:16px 20px 20px; padding:12px;
    background:#f6f2e9; border:1px solid #ecdcae; border-radius:10px;
    font-size:.88rem; font-weight:600; color:#6b5a2e; cursor:pointer; font-family:inherit;
  }
  .edit-btn:active{background:#efe6d2;}
  .edited-flag{
    margin:12px 20px 0; padding:8px 12px; background:#eef4ee; border:1px solid #cfe0cc;
    border-radius:8px; font-size:.78rem; color:#3d6b3d; font-weight:600;
  }
  .edit-note{
    margin:0 20px 12px; padding:10px 14px; background:#fdf6e3; border:1px solid #ecdcae;
    border-radius:8px; font-size:.78rem; color:#6b5a2e;
  }
  .autosave-status{
    margin:0 20px 12px; font-size:.78rem; font-weight:600; color:#3d6b3d;
  }
  .edit-field input[type="text"]{
    width:100%; font-size:.9rem; padding:6px 8px; border:1px solid #c9c2b3; border-radius:6px;
    background:#fff; color:var(--ink); font-family:inherit;
  }
  .edit-actions{
    display:flex; flex-direction:column; gap:10px; padding:16px 20px 20px;
  }
  .btn-save{
    padding:13px; background:var(--accent); color:#fff; border:none; border-radius:10px;
    font-size:.92rem; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .btn-cancel{
    padding:12px; background:none; border:1px solid #c9c2b3; border-radius:10px;
    font-size:.88rem; color:var(--ink); cursor:pointer; font-family:inherit;
  }
  .btn-reset{
    padding:12px; background:none; border:1px solid #e0b0a8; border-radius:10px;
    font-size:.85rem; color:#a33; cursor:pointer; font-family:inherit;
  }
  .note{
    margin:16px 0 0; padding:12px 16px; background:#fbf5e8; border:1px solid #ecdcae;
    border-radius:10px; font-size:.8rem; color:#6b5a2e;
  }
  .bbd-calc{
    margin:16px 20px 0; padding:14px 16px; background:#f3f7f2; border:1px solid #cfe0cc;
    border-radius:10px;
  }
  .bbd-calc .bbd-title{font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; color:#4a6b46; font-weight:700; margin-bottom:8px;}
  .bbd-calc .bbd-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .bbd-calc input[type="date"]{flex:1; min-width:150px; padding:8px 10px; font-size:.9rem; border:1px solid #b9cdb4; border-radius:7px;}
  .bbd-calc .bbd-result{margin-top:10px; font-size:1.05rem; font-weight:700; color:#2e5c2e;}
  .bbd-calc .bbd-sub{font-size:.75rem; color:#5a7a56; margin-top:2px;}
  @media (max-width:520px){ .grid{grid-template-columns:1fr;} .field:nth-child(2n){border-right:1px solid var(--line);} }
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

</div>

<main id="main"></main>

const search = document.getElementById('search');
const suggestions = document.getElementById('suggestions');
const main = document.getElementById('main');

products.forEach((p,i)=>p.__idx=i);

// ---- Edit overrides (persisted in this browser via localStorage) ----
const OVERRIDES_KEY = 'productOverrides_v1';

function loadOverrides(){
  try{
    return JSON.parse(localStorage.getItem(OVERRIDES_KEY)) || {};
  } catch(e){ return {}; }
}

function saveOverrides(obj){
  try{
    localStorage.setItem(OVERRIDES_KEY, JSON.stringify(obj));
    return true;
  } catch(e){ return false; }
}

function applyOverrides(){
  const overrides = loadOverrides();
  products.forEach(p=>{
    if(overrides[p.code]){
      Object.assign(p, overrides[p.code]);
    }
  });
}

const ORIGINAL_PRODUCTS = products.map(p=>({...p}));
applyOverrides();

// ---- Export / Import ----
function getExportColumns(){
  return [
    {header:'Customer', key:'customer'},
    {header:'Farm Foods Product Code', key:'code'},
    ...EDITABLE_FIELDS_META.map(f=>({header:f.label, key:f.key}))
  ];
}

function showSyncStatus(msg, isError){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  el.textContent = msg;
  el.className = 'sync-status' + (isError ? ' error' : '');
  setTimeout(()=>{ if(el.textContent===msg) el.textContent=''; }, 5000);
}

function downloadBlob(content, filename, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportJSON(){
  const overrides = loadOverrides();
  const payload = {
    exportedAt: new Date().toISOString(),
    overrides: overrides
  };
  downloadBlob(JSON.stringify(payload, null, 2), 'product-lookup-overrides.json', 'application/json');
  showSyncStatus('Exported JSON with ' + Object.keys(overrides).length + ' edited product(s).');
}

function exportExcel(){
  if(typeof XLSX === 'undefined'){
    showSyncStatus('Excel library did not load — check your connection and try again.', true);
    return;
  }
  const columns = getExportColumns();
  const rows = products.map(p=>{
    const row = {};
    columns.forEach(c=>{ row[c.header] = p[c.key] || ''; });
    return row;
  });
  const ws = XLSX.utils.json_to_sheet(rows, {header: columns.map(c=>c.header)});
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Products');
  XLSX.writeFile(wb, 'product-lookup.xlsx');
  showSyncStatus('Exported ' + rows.length + ' products to Excel.');
}

function importJSONFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      const incoming = parsed.overrides || parsed; // accept either wrapped or raw overrides object
      const current = loadOverrides();
      let count = 0;
      Object.keys(incoming).forEach(code=>{
        current[code] = {...(current[code]||{}), ...incoming[code]};
        count++;
      });
      saveOverrides(current);
      applyOverrides();
      renderBrowseList();
      showSyncStatus('Imported edits for ' + count + ' product(s) from JSON.');
    } catch(e){
      showSyncStatus('Could not read that JSON file.', true);
    }
  };
  reader.readAsText(file);
}

function importExcelFile(file){
  if(typeof XLSX === 'undefined'){
    showSyncStatus('Excel library did not load — check your connection and try again.', true);
    return;
  }
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = new Uint8Array(reader.result);
      const wb = XLSX.read(data, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      const headerToKey = {};
      getExportColumns().forEach(c=>{ headerToKey[c.header] = c.key; });

      const current = loadOverrides();
      let count = 0;
      rows.forEach(row=>{
        const code = (row['Farm Foods Product Code'] || '').toString().trim();
        if(!code) return;
        const match = products.find(p=>p.code===code);
        if(!match) return;
        const updated = {};
        EDITABLE_FIELDS_META.forEach(f=>{
          if(row[f.label] !== undefined && row[f.label] !== ''){
            updated[f.key] = row[f.label].toString();
          }
        });
        if(Object.keys(updated).length){
          current[code] = {...(current[code]||{}), ...updated};
          count++;
        }
      });
      saveOverrides(current);
      applyOverrides();
      renderBrowseList();
      showSyncStatus('Imported edits for ' + count + ' product(s) from Excel.');
    } catch(e){
      showSyncStatus('Could not read that Excel file.', true);
    }
  };
  reader.readAsArrayBuffer(file);
}

const CUSTOMER_ORDER = ["ALDI", "COLES", "WW", "PROPRIETARY"];

function groupByCustomer(list){
  const groups = {};
  list.forEach(p=>{
    if(!groups[p.customer]) groups[p.customer] = [];
    groups[p.customer].push(p);
  });
  return groups;
}

const GROUP_NOTES = {
  ALDI: "General handwritten reference no. for all ALDI products: 1148018"
};

function productIcon(name){
  const n = name.toLowerCase();
  if(n.includes('kebab')) return '🍢';
  if(n.includes('meatball')) return '🧆';
  if(n.includes('burger')) return '🍔';
  if(n.includes('rissole')) return '🥩';
  if(n.includes('sausage') || n.includes('bratwurst')) return '🌭';
  if(n.includes('kofta')) return '🍖';
  if(n.includes('meatloaf')) return '🍖';
  return '🥫';
}

function productCategory(name){
  const n = name.toLowerCase();
  if(n.includes('kebab')) return 'Kebabs';
  if(n.includes('meatball')) return 'Meatballs';
  if(n.includes('burger')) return 'Burgers';
  if(n.includes('rissole')) return 'Rissoles';
  if(n.includes('sausage') || n.includes('bratwurst')) return 'Sausages';
  if(n.includes('kofta')) return 'Koftas';
  if(n.includes('meatloaf')) return 'Meatloaf';
  return 'Other';
}

const CATEGORY_ORDER = ["Burgers","Meatballs","Kebabs","Rissoles","Sausages","Koftas","Meatloaf","Other"];

function productRowHTML(p){
  return `
    <button type="button" class="product-row" data-idx="${p.__idx}">
      <span class="icon">${productIcon(p.name)}</span>
      <span class="info">
        <span class="name">${p.name}</span>
        <span class="sub">${p.netWeight} · ${p.code}</span>
      </span>
      <span class="arrow">›</span>
    </button>`;
}

function renderBrowseList(){
  const groups = groupByCustomer(products);
  const order = CUSTOMER_ORDER.filter(c=>groups[c]);
  main.innerHTML = order.map(customer=>{
    const items = groups[customer];
    const note = GROUP_NOTES[customer];

    // sub-group larger lists (like COLES) by product type for easier scanning
    let listHTML;
    if(items.length > 10){
      const byCategory = {};
      items.forEach(p=>{
        const cat = productCategory(p.name);
        if(!byCategory[cat]) byCategory[cat] = [];
        byCategory[cat].push(p);
      });
      const catOrder = CATEGORY_ORDER.filter(c=>byCategory[c]);
      listHTML = catOrder.map(cat => `
        <div class="subcat-head">${cat}</div>
        ${byCategory[cat].map(productRowHTML).join('')}
      `).join('');
    } else {
      listHTML = items.map(productRowHTML).join('');
    }

    return `
      <div class="group collapsed" data-customer="${customer}">
        <div class="group-head" data-toggle="${customer}">
          <span class="chevron">▾</span>
          <span class="badge ${customer.toLowerCase()}">${customer}</span>
          <span class="count">${items.length} product${items.length===1?'':'s'}</span>
        </div>
        ${note ? `<div class="group-note">${note}</div>` : ''}
        <div class="group-list">
          ${listHTML}
        </div>
      </div>`;
  }).join('');

  main.querySelectorAll('.group-head').forEach(h=>{
    h.addEventListener('click', ()=>{
      h.closest('.group').classList.toggle('collapsed');
    });
  });
  main.querySelectorAll('.product-row').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      render(products[btn.getAttribute('data-idx')]);
    });
  });
}

renderBrowseList();

document.getElementById('exportJsonBtn').addEventListener('click', exportJSON);
document.getElementById('exportExcelBtn').addEventListener('click', exportExcel);
document.getElementById('importBtn').addEventListener('click', ()=>{
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  if(file.name.toLowerCase().endsWith('.json')){
    importJSONFile(file);
  } else if(file.name.toLowerCase().match(/\.xlsx?$/)){
    importExcelFile(file);
  } else {
    showSyncStatus('Please choose a .json or .xlsx file.', true);
  }
  e.target.value = ''; // allow re-importing the same file later
});

function closeSuggestions(){
  suggestions.classList.remove('open');
  suggestions.innerHTML = '';
}

function showSuggestions(list){
  if(list.length===0){
    suggestions.innerHTML = '<button disabled style="color:#999;cursor:default;">No matches</button>';
    suggestions.classList.add('open');
    return;
  }
  suggestions.innerHTML = list.map(p =>
    `<button type="button" data-idx="${p.__idx}"><span class="tag">${p.customer}</span>${p.name}</button>`
  ).join('');
  suggestions.classList.add('open');
}

search.addEventListener('input', ()=>{
  const q = search.value.toLowerCase().trim();
  if(q===""){ closeSuggestions(); return; }
  const filtered = products.filter(p =>
    p.name.toLowerCase().includes(q) ||
    p.code.toLowerCase().includes(q) ||
    p.barcodeLast4.toLowerCase().includes(q) ||
    p.customer.toLowerCase().includes(q)
  );
  showSuggestions(filtered);
});

search.addEventListener('focus', ()=>{
  if(search.value.trim()!=="") search.dispatchEvent(new Event('input'));
});

suggestions.addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-idx]');
  if(!btn) return;
  const idx = btn.getAttribute('data-idx');
  render(products[idx]);
  search.value = '';
  closeSuggestions();
});

document.addEventListener('click', (e)=>{
  if(!e.target.closest('.search-wrap')) closeSuggestions();
});


function parseShelfDays(shelfLife){
  const m = shelfLife && shelfLife.match(/(\d+)/);
  return m ? parseInt(m[1], 10) : null;
}

function formatDate(d){
  return d.toLocaleDateString('en-AU', { weekday:'short', day:'numeric', month:'short', year:'numeric' });
}

function calcBBD(p){
  const days = parseShelfDays(p.shelfLife);
  const dateInput = document.getElementById('prodDate');
  const resultEl = document.getElementById('bbdResult');
  const subEl = document.getElementById('bbdSub');
  if(!dateInput.value || days===null){
    resultEl.textContent = '—';
    subEl.textContent = days===null ? 'Could not read a day count from this shelf life value.' : 'Pick a production date above.';
    return;
  }
  const prodDate = new Date(dateInput.value + 'T00:00:00');
  const bbd = new Date(prodDate);
  bbd.setDate(bbd.getDate() + days);
  resultEl.textContent = formatDate(bbd);
  subEl.textContent = `${days} days from production (${p.shelfLife})`;
}

function field(label, value){
  return `<div class="field"><div class="label">${label}</div><div class="value">${value||'—'}</div></div>`;
}

const EDITABLE_FIELDS_META = [
  {key:'name', label:'Product Name'},
  {key:'shelfLife', label:'Shelf Life'},
  {key:'barcodeLast4', label:'Last 4 Digits of Unit Barcode'},
  {key:'claims', label:'Product Claims'},
  {key:'allergens', label:'Allergens'},
  {key:'unitBarcode', label:'Unit Barcode'},
  {key:'gtin', label:'GTIN Barcode'},
  {key:'netWeight', label:'Net Weight'},
  {key:'waxPapers', label:'Wax Papers'},
  {key:'traySize', label:'Tray Size'},
  {key:'trayColour', label:'Tray Colour'},
  {key:'unitsPerTray', label:'Units per Tray'},
  {key:'unitsPerCarton', label:'Units per Carton'},
  {key:'labelPlacement', label:'Label/Sleeve Placement'},
  {key:'cartonCode', label:'Carton/Crate Code'},
  {key:'cartonWeight', label:'Carton/Crate Weight'},
  {key:'flu', label:'FLU #'},
  {key:'t1', label:'T1 (g)'},
  {key:'t2', label:'T2 (g)'},
  {key:'bizerbaTareG', label:'Bizerba Tare (g)'},
  {key:'xray', label:'X-Ray/Metal Detector Program'},
  {key:'handwrittenCode', label:'Handwritten Reference Code'}
];

function render(p, editMode){
  const overrides = loadOverrides();
  const hasOverride = !!overrides[p.code];

  if(editMode){
    // snapshot so Cancel can revert exactly what existed before this edit session
    const sessionStartOverride = overrides[p.code] ? {...overrides[p.code]} : null;
    const sessionStartProduct = {...p};

    main.innerHTML = `
      <button type="button" class="back-btn" id="backBtn">← All products</button>
      <div class="card">
        <div class="card-head">
          <div>
            <span class="badge ${p.customer.toLowerCase()}">${p.customer}</span>
            <h2>Editing: ${p.name}</h2>
          </div>
        </div>
        <div class="edit-note">Changes save automatically to this device/browser as you type. Farm Foods Product Code (${p.code}) can't be changed since it's used to identify the product.</div>
        <div class="autosave-status" id="autosaveStatus">No changes yet</div>
        <div class="grid">
          ${EDITABLE_FIELDS_META.map(f=>`
            <div class="field edit-field">
              <div class="label">${f.label}</div>
              <input type="text" data-key="${f.key}" value="${(p[f.key]||'').toString().replace(/"/g,'&quot;')}">
            </div>
          `).join('')}
        </div>
        <div class="edit-actions">
          <button type="button" class="btn-save" id="saveBtn">✓ Done</button>
          <button type="button" class="btn-cancel" id="cancelBtn">Cancel changes</button>
          ${hasOverride ? `<button type="button" class="btn-reset" id="resetBtn">↺ Reset this product to original</button>` : ''}
        </div>
      </div>`;

    const statusEl = document.getElementById('autosaveStatus');
    let debounceTimer = null;

    function collectValues(){
      const updated = {};
      main.querySelectorAll('[data-key]').forEach(input=>{
        updated[input.getAttribute('data-key')] = input.value;
      });
      return updated;
    }

    function persistNow(){
      const updated = collectValues();
      const allOverrides = loadOverrides();
      allOverrides[p.code] = updated;
      saveOverrides(allOverrides);
      Object.assign(p, updated);
      if(statusEl) statusEl.textContent = '✓ Saved';
    }

    main.querySelectorAll('[data-key]').forEach(input=>{
      input.addEventListener('input', ()=>{
        if(statusEl) statusEl.textContent = 'Saving…';
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(persistNow, 600);
      });
    });

    document.getElementById('backBtn').addEventListener('click', ()=>{ clearTimeout(debounceTimer); persistNow(); renderBrowseList(); });
    document.getElementById('cancelBtn').addEventListener('click', ()=>{
      clearTimeout(debounceTimer);
      const allOverrides = loadOverrides();
      if(sessionStartOverride){
        allOverrides[p.code] = sessionStartOverride;
      } else {
        delete allOverrides[p.code];
      }
      saveOverrides(allOverrides);
      Object.assign(p, sessionStartProduct);
      render(p, false);
    });
    document.getElementById('saveBtn').addEventListener('click', ()=>{
      clearTimeout(debounceTimer);
      persistNow();
      render(p, false);
    });
    if(hasOverride){
      document.getElementById('resetBtn').addEventListener('click', ()=>{
        const allOverrides = loadOverrides();
        delete allOverrides[p.code];
        saveOverrides(allOverrides);
        const original = ORIGINAL_PRODUCTS.find(op=>op.code===p.code);
        if(original) Object.assign(p, original);
        render(p, false);
      });
    }
    window.scrollTo(0,0);
    return;
  }

  main.innerHTML = `
    <button type="button" class="back-btn" id="backBtn">← All products</button>
    <div class="card">
      <div class="card-head">
        <div>
          <span class="badge ${p.customer.toLowerCase()}">${p.customer}</span>
          <h2>${p.name}</h2>
        </div>
        ${p.handwrittenCode ? `<div class="hw-pill"><span class="hw-label">Handwritten Ref</span><span class="hw-value">${p.handwrittenCode}</span></div>` : ''}
      </div>
      <div class="allergen-flag">⚠ Allergens: ${p.allergens}</div>
      ${hasOverride ? `<div class="edited-flag">✎ This product has local edits</div>` : ''}
      <div class="bbd-calc">
        <div class="bbd-title">Calculate Best-Before Date</div>
        <div class="bbd-row">
          <input type="date" id="prodDate">
        </div>
        <div class="bbd-result" id="bbdResult">—</div>
        <div class="bbd-sub" id="bbdSub">Pick a production date above.</div>
      </div>
      <div class="grid">
        ${field("Farm Foods Product Code", p.code)}
        ${field("Shelf Life", p.shelfLife)}
        ${field("Last 4 Digits of Unit Barcode", p.barcodeLast4)}
        ${field("Product Claims", p.claims)}
        ${field("Unit Barcode", p.unitBarcode)}
        ${field("GTIN Barcode", p.gtin)}
        ${field("Net Weight", p.netWeight)}
        ${field("Wax Papers", p.waxPapers)}
        ${field("Tray Size", p.traySize)}
        ${field("Tray Colour", p.trayColour)}
        ${field("Units per Tray", p.unitsPerTray)}
        ${field("Units per Carton", p.unitsPerCarton)}
        ${field("Label/Sleeve Placement", p.labelPlacement)}
        ${field("Carton/Crate Code", p.cartonCode)}
        ${field("Carton/Crate Weight", p.cartonWeight)}
        ${field("FLU #", p.flu)}
        ${field("T1 (g)", p.t1)}
        ${field("T2 (g)", p.t2)}
        ${field("Bizerba Tare (g)", p.bizerbaTareG)}
        ${field("X-Ray/Metal Detector Program", p.xray)}
      </div>
      <div class="note">Sourced from the QMx-004 Product Information &amp; Packaging Matrix and cross-checked (net weight × units/carton = carton weight) for consistency.</div>
      <button type="button" class="edit-btn" id="editBtn">✎ Edit this product</button>
    </div>`;

  document.getElementById('editBtn').addEventListener('click', ()=>render(p, true));

  const dateInput = document.getElementById('prodDate');
  const today = new Date();
  dateInput.value = today.toISOString().slice(0,10);
  dateInput.addEventListener('change', ()=>calcBBD(p));
  calcBBD(p);

  document.getElementById('backBtn').addEventListener('click', renderBrowseList);
  window.scrollTo(0,0);
}
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  });
}
</script>
